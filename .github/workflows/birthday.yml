name: Check Birthdays and Lunar Days

on:
  schedule:
    - cron: '0 1 * * *'   # 8:00 AM giờ Việt Nam
    - cron: '0 13 * * *'  # 8:00 PM giờ Việt Nam
  workflow_dispatch:

jobs:
  check-and-announce:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Đảm bảo requirements.txt có đủ: google-api-python-client, google-auth, 
          # python-telegram-bot, lunarcalendar, pytz
          pip install -r requirements.txt

      - name: Run scripts
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Nếu bạn dùng chat ID khác cho tin nhắn đặc biệt, hãy giữ biến này
          TELEGRAM_CHAT_ID_SPECIAL: ${{ secrets.TELEGRAM_CHAT_ID_SPECIAL }} 
        run: |
          echo "🎂 Đang kiểm tra sinh nhật..."
          python birthday_checker.py
          
          echo "🌙 Đang kiểm tra Rằm/Mùng 1..."
          python lunar_announcer.py

      # ------------------- Bước cập nhật nhật ký chạy -------------------
      - name: Update last_check.txt
        run: |
          mkdir -p .github/logs
          LOG_FILE=".github/logs/last_check.txt"
          CURRENT_TIME=$(TZ='Asia/Ho_Chi_Minh' date '+%Y-%m-%d %H:%M:%S %Z')
          echo "$CURRENT_TIME - Workflow ran successfully (run_id: ${{ github.run_id }})" > temp.txt
          if [ -f "$LOG_FILE" ]; then
            cat "$LOG_FILE" >> temp.txt
          fi
          head -n 1000 temp.txt > "$LOG_FILE"
          rm temp.txt

      - name: Commit & Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/logs/last_check.txt
          git commit -m "Update logs [skip ci]" || echo "Nothing to commit"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
